name: Blackwell Windows x64 cp311 cuda128 probe

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA toolkit version to probe for sm_120 support
        required: true
        default: '12.8.1'
      torch_version:
        description: PyTorch version to probe from the cu128 index
        required: true
        default: '2.7.1+cu128'
      torchvision_version:
        description: TorchVision version to probe from the cu128 index
        required: true
        default: '0.22.1+cu128'

jobs:
  blackwell-probe:
    name: Probe Blackwell sm_120 prerequisites only
    runs-on: windows-latest
    env:
      PYTHON_VERSION: '3.11'
      PYTORCH_CUDA_INDEX: https://download.pytorch.org/whl/cu128
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA toolkit candidate
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ github.event.inputs.cuda_version }}
          method: network

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Probe CUDA and PyTorch Blackwell prerequisites
        shell: pwsh
        env:
          CUDA_VERSION_INPUT: ${{ github.event.inputs.cuda_version }}
          TORCH_VERSION_INPUT: ${{ github.event.inputs.torch_version }}
          TORCHVISION_VERSION_INPUT: ${{ github.event.inputs.torchvision_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = Get-Location
          $reportDir = Join-Path $repoRoot 'build\blackwell-sm120-probe'
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $reportPath = Join-Path $reportDir 'BLACKWELL-SM120-PROBE.json'

          if (-not $env:CUDA_PATH) {
            $env:CUDA_PATH = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA\v$env:CUDA_VERSION_INPUT"
          }
          $env:Path = "$($env:CUDA_PATH)\bin;$env:Path"
          $nvccPath = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          if (-not (Test-Path $nvccPath)) {
            throw "CUDA nvcc is unavailable at $nvccPath; this probe must fail clearly."
          }

          $nvccVersion = (& $nvccPath --version) -join "`n"
          $gpuArchList = (& $nvccPath --list-gpu-arch) -join "`n"
          $gpuCodeList = (& $nvccPath --list-gpu-code) -join "`n"

          python -m pip install --upgrade pip
          python -m pip install --index-url $env:PYTORCH_CUDA_INDEX torch==$env:TORCH_VERSION_INPUT torchvision==$env:TORCHVISION_VERSION_INPUT
          $torchRaw = @'
          import json
          import torch
          print(json.dumps({
              "torch_version": torch.__version__,
              "torch_cuda_version": torch.version.cuda,
              "cuda_available_on_runner": bool(torch.cuda.is_available()),
          }, sort_keys=True))
          '@ | python -
          $torchProbe = $torchRaw | ConvertFrom-Json

          $report = [ordered]@{
            probe_only = $true
            publish_policy = 'Do not add to wheelhouse.manifest.json from this probe; this is not a supported Pixal3D lane.'
            requested_lane = 'windows-x64-cp311-cuda128-blackwell-sm120-probe'
            python_version = $env:PYTHON_VERSION
            cuda_version_input = $env:CUDA_VERSION_INPUT
            cuda_path = $env:CUDA_PATH
            pytorch_cuda_index = $env:PYTORCH_CUDA_INDEX
            torch_version_input = $env:TORCH_VERSION_INPUT
            torchvision_version_input = $env:TORCHVISION_VERSION_INPUT
            nvcc_version = $nvccVersion
            nvcc_lists_compute_120 = $gpuArchList.Contains('compute_120')
            nvcc_lists_sm_120 = $gpuCodeList.Contains('sm_120')
            torch = [ordered]@{
              version = $torchProbe.torch_version
              cuda_version = $torchProbe.torch_cuda_version
              cuda_available_on_runner = [bool]$torchProbe.cuda_available_on_runner
            }
            required_future_work = @(
              'Build or source exact-stack Blackwell-compatible wheels for flex_gemm_ap, cumesh_vb, o_voxel_vb_ap, drtk, flash_attn, nvdiffrast, nvdiffrec_render.',
              'Build and verify NATTEN with HAS_LIBNATTEN=True for the same torch/CUDA/Python stack.',
              'Validate real generation on RTX 50-series hardware before publishing any release-backed wheelhouse lane.'
            )
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content -Path $reportPath -Encoding UTF8
          Get-Content -Path $reportPath

      - name: Upload Blackwell probe report only
        uses: actions/upload-artifact@v4
        with:
          name: blackwell-sm120-windows-x64-cp311-cuda128-probe
          path: build/blackwell-sm120-probe/BLACKWELL-SM120-PROBE.json
          if-no-files-found: error
