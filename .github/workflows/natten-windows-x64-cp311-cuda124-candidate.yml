name: NATTEN v0.21.0 Windows x64 cp311 th26 cu124 candidate

on:
  workflow_dispatch:
    inputs:
      cuda_arch_list:
        description: CUDA arch list for the NATTEN candidate build
        required: true
        default: '7.5;8.6;8.9'

jobs:
  build-natten-candidate:
    name: Build natten v0.21.0 windows-x64-cp311-th26-cu124 candidate
    runs-on: windows-latest
    env:
      NATTEN_VERSION: v0.21.0
      PYTHON_VERSION: '3.11'
      PYTORCH_CUDA_INDEX: https://download.pytorch.org/whl/cu124
      TORCH_VERSION: 2.6.0+cu124
      TORCHVISION_VERSION: 0.21.0+cu124
      CUDA_VERSION: 12.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA 12.4 toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify CUDA 12.4 nvcc is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CUDA_PATH) {
            $env:CUDA_PATH = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v12.4'
          }
          $nvccPath = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          if (-not (Test-Path $nvccPath)) {
            throw 'CUDA 12.4 nvcc is unavailable; fail clearly instead of uploading a placeholder candidate artifact.'
          }
          $env:Path = "$($env:CUDA_PATH)\bin;$($env:CUDA_PATH)\libnvvp;$env:Path"
          cl
          nvcc --version
          "CUDA_PATH=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install torch 2.6.0+cu124 and build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install --index-url $env:PYTORCH_CUDA_INDEX torch==$env:TORCH_VERSION torchvision==$env:TORCHVISION_VERSION
          python -m pip install cmake ninja packaging wheel setuptools

      - name: Clone NATTEN v0.21.0 with submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --branch $env:NATTEN_VERSION --depth 1 --recurse-submodules https://github.com/SHI-Labs/NATTEN.git build\natten-src

      - name: Patch NATTEN MSVC-incompatible warning flags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = 'build\natten-src'
          $candidateFiles = Get-ChildItem -Path $sourceRoot -Recurse -File -Include '*.py', '*.cmake', 'CMakeLists.txt'
          $replacements = [ordered]@{
            '-Xcompiler -Wall' = ''
            '-Xcompiler=-Wconversion' = ''
            '-Xcompiler=-fno-strict-aliasing' = ''
            '"-Wall"' = '""'
            '"-Wconversion"' = '""'
            '"-fno-strict-aliasing"' = '""'
            "'-Wall'" = "''"
            "'-Wconversion'" = "''"
            "'-fno-strict-aliasing'" = "''"
          }
          $patched = @()
          foreach ($file in $candidateFiles) {
            $before = Get-Content -Path $file.FullName -Raw
            $after = $before
            foreach ($entry in $replacements.GetEnumerator()) {
              $after = $after.Replace($entry.Key, $entry.Value)
            }
            if ($after -ne $before) {
              Set-Content -Path $file.FullName -Value $after -Encoding utf8
              $patched += $file.FullName
            }
          }
          if ($patched.Count -lt 1) {
            throw 'Expected to patch NATTEN GCC-only compiler flags for MSVC, but no source files changed.'
          }
          $patched | ForEach-Object { "Patched MSVC-incompatible flags in $_" }

      - name: Patch vendored CUTLASS C++17 detection for MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platformHeader = 'build\natten-src\third_party\cutlass\include\cutlass\platform\platform.h'
          $before = Get-Content -Path $platformHeader -Raw
          $needle = '#if (201703L <=__cplusplus)'
          $replacement = '#if (201703L <=__cplusplus) || (defined(_MSVC_LANG) && (201703L <= _MSVC_LANG))'
          if (-not $before.Contains($needle)) {
            throw 'Expected CUTLASS platform.h C++17 detection guard was not found.'
          }
          $after = $before.Replace($needle, $replacement)
          Set-Content -Path $platformHeader -Value $after -Encoding utf8
          Write-Host 'Patched vendored CUTLASS platform.h to use _MSVC_LANG for C++17 detection.'

      - name: Build NATTEN wheel candidate
        shell: pwsh
        env:
          INPUT_CUDA_ARCH_LIST: ${{ github.event.inputs.cuda_arch_list }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = Get-Location
          $workRoot = Join-Path $repoRoot 'build\natten-0.21.0-windows-x64-cp311-cuda124-candidate'
          $wheelDir = Join-Path $workRoot 'dist'
          $reportPath = Join-Path $workRoot 'NATTEN-0.21.0-CANDIDATE.json'
          $verificationPath = Join-Path $workRoot 'verification.json'
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null
          $archList = if ([string]::IsNullOrWhiteSpace($env:INPUT_CUDA_ARCH_LIST)) { '7.5;8.6;8.9' } else { $env:INPUT_CUDA_ARCH_LIST }
          $env:CUDA_ARCH_LIST = $archList
          $env:TORCH_CUDA_ARCH_LIST = $archList
          $env:NATTEN_CUDA_ARCH = $archList
          $env:USE_NINJA = '1'
          $env:CMAKE_GENERATOR = 'Ninja'
          if (-not $env:CUDA_PATH) {
            $env:CUDA_PATH = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v12.4'
          }
          $env:Path = "$($env:CUDA_PATH)\bin;$($env:Path)"
          Push-Location build\natten-src
          try {
            python -m pip wheel . --no-build-isolation --no-deps --wheel-dir $wheelDir
          }
          finally {
            Pop-Location
          }
          $wheels = @(Get-ChildItem -Path $wheelDir -Filter '*.whl' -File)
          if ($wheels.Count -lt 1) {
            throw 'NATTEN candidate build produced no wheels.'
          }
          $wheelPath = $wheels[0].FullName
          python -m pip install --force-reinstall --no-deps $wheelPath
          $verifyScript = @'
          import json
          try:
              import natten
              import torch
              payload = {
                  "importable": True,
                  "__version__": getattr(natten, "__version__", None),
                  "HAS_LIBNATTEN": getattr(natten, "HAS_LIBNATTEN", None),
                  "torch_version": torch.__version__,
                  "torch_cuda_version": torch.version.cuda,
              }
          except RuntimeError as exc:
              message = str(exc)
              if "Found no NVIDIA driver" in message:
                  payload = {
                      "importable": False,
                      "HAS_LIBNATTEN": False,
                      "verification_blocked": "no_nvidia_driver",
                      "error": message,
                  }
              else:
                  payload = {
                      "importable": False,
                      "HAS_LIBNATTEN": False,
                      "verification_blocked": "runtime_error",
                      "error": message,
                  }
          except Exception as exc:
              payload = {
                  "importable": False,
                  "HAS_LIBNATTEN": False,
                  "verification_blocked": type(exc).__name__,
                  "error": str(exc),
              }
          print(json.dumps(payload, sort_keys=True))
          '@
          $verificationRaw = $verifyScript | python -
          $verificationRaw | Set-Content -Path $verificationPath -Encoding utf8
          $verification = Get-Content -Path $verificationPath -Raw | ConvertFrom-Json
          $report = [ordered]@{
            package = 'natten'
            candidate_only = $true
            source_repository = 'https://github.com/SHI-Labs/NATTEN'
            source_tag = $env:NATTEN_VERSION
            python_version = $env:PYTHON_VERSION
            torch_version = $env:TORCH_VERSION
            torchvision_version = $env:TORCHVISION_VERSION
            torch_cuda_index = $env:PYTORCH_CUDA_INDEX
            cuda_version = $env:CUDA_VERSION
            cuda_path = $env:CUDA_PATH
            cuda_arch_list = $archList
            wheel_filenames = @($wheels | ForEach-Object { $_.Name })
            verification = [ordered]@{
              importable = [bool]$verification.importable
              natten_version = $verification.__version__
              has_libnatten = [bool]$verification.HAS_LIBNATTEN
              verification_blocked = $verification.verification_blocked
              error = $verification.error
              torch_version = $verification.torch_version
              torch_cuda_version = $verification.torch_cuda_version
            }
            publish_policy = 'Candidate artifact only. Verify HAS_LIBNATTEN=True before any wheelhouse integration, and do not update wheelhouse.manifest.json from this workflow.'
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Path $reportPath -Encoding utf8
          if (-not $verification.HAS_LIBNATTEN) {
            Write-Warning 'Built candidate could not be fully verified with HAS_LIBNATTEN=True on this runner. Keep this candidate out of wheelhouse integration until verified on a real NVIDIA Windows machine.'
          }

      - name: Upload candidate artifact only
        uses: actions/upload-artifact@v4
        with:
          name: natten-0.21.0-windows-x64-cp311-cuda124-candidate
          path: |
            build/natten-0.21.0-windows-x64-cp311-cuda124-candidate/dist/*.whl
            build/natten-0.21.0-windows-x64-cp311-cuda124-candidate/NATTEN-0.21.0-CANDIDATE.json
            build/natten-0.21.0-windows-x64-cp311-cuda124-candidate/verification.json
          if-no-files-found: error
