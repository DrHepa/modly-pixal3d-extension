name: Wheelhouse Windows x64 cp311 cuda128 Blackwell candidate

on:
  workflow_dispatch:
    inputs:
      cuda_arch_list:
        description: Blackwell CUDA arch list for native NATTEN build
        required: true
        default: '12.0'
      cuda_version:
        description: CUDA toolkit version for sm_120 candidate build
        required: true
        default: '12.8.1'
      natten_version:
        description: NATTEN git tag to build
        required: true
        default: 'v0.21.6'

jobs:
  build-wheelhouse:
    name: Build windows-x64-cp311-cuda128-blackwell candidate
    runs-on: windows-2022
    env:
      WHEELHOUSE_LANE: windows-x64-cp311-cuda128-blackwell
      PYTHON_VERSION: '3.11'
      TORCH_VERSION: 2.7.1+cu128
      TORCHVISION_VERSION: 0.22.1+cu128
      PYTORCH_CUDA_INDEX: https://download.pytorch.org/whl/cu128
      NATTEN_PACKAGE_VERSION: '0.21.6'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA toolkit candidate
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ github.event.inputs.cuda_version }}
          method: network

      - name: Install CUDA-supported VS 2022 v143 MSVC 14.38 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = Get-Location
          $evidenceDir = Join-Path (Join-Path $repoRoot 'build') 'blackwell-toolchain-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $component = 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64'
          $vsInstallerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $vsInstallerDir 'vswhere.exe'
          $vsInstaller = Join-Path $vsInstallerDir 'vs_installer.exe'
          $installPath = & $vswhere -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath -latest
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw 'Visual Studio 2022 with C++ build tools was not found on the runner.'
          }
          if ($installPath -match '"') {
            throw "Visual Studio install path contains an unsupported quote character: $installPath"
          }
          if ($component -notmatch '^[A-Za-z0-9._-]+$') {
            throw "Unexpected Visual Studio component id: $component"
          }
          $escapedInstallPath = $installPath -replace '"', '\"'
          $installerArguments = "modify --installPath `"$escapedInstallPath`" --add $component --quiet --norestart --nocache"
          "vs_install_path=$installPath" | Set-Content -Path (Join-Path $evidenceDir 'vs-selection.txt') -Encoding UTF8
          "component=$component" | Add-Content -Path (Join-Path $evidenceDir 'vs-selection.txt') -Encoding UTF8

          function Get-Msvc1438Toolset {
            param([string]$VsInstallPath)
            $toolsetDir = Join-Path $VsInstallPath 'VC\Tools\MSVC'
            if (-not (Test-Path $toolsetDir)) {
              return @()
            }
            return @(Get-ChildItem -Path $toolsetDir -Directory -Filter '14.38.*' | Sort-Object Name -Descending | Select-Object -First 1)
          }

          function Write-AvailableMsvcToolsets {
            param([string]$VsInstallPath, [string]$EvidenceDir)
            $toolsetDir = Join-Path $VsInstallPath 'VC\Tools\MSVC'
            $outPath = Join-Path $EvidenceDir 'available-msvc-toolsets.txt'
            if (Test-Path $toolsetDir) {
              Get-ChildItem -Path $toolsetDir -Directory | Sort-Object Name | ForEach-Object { $_.FullName } | Set-Content -Path $outPath -Encoding UTF8
            } else {
              "missing_toolset_dir=$toolsetDir" | Set-Content -Path $outPath -Encoding UTF8
            }
            Write-Host 'Available MSVC toolsets:'
            Get-Content -Path $outPath | ForEach-Object { Write-Host "  $_" }
          }

          function Copy-VsInstallerLogs {
            param([string]$EvidenceDir)
            $logDir = Join-Path $EvidenceDir 'vs-installer-logs'
            New-Item -ItemType Directory -Force -Path $logDir | Out-Null
            $candidateLogs = @()
            foreach ($root in @($env:TEMP, $env:LOCALAPPDATA, $env:ProgramData)) {
              if (-not [string]::IsNullOrWhiteSpace($root) -and (Test-Path $root)) {
                $candidateLogs += @(Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '^(dd_|vs_|VisualStudio).*\.log$' } |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 40)
              }
            }
            Write-Host 'VS Installer log candidates:'
            if ($candidateLogs.Count -eq 0) {
              'No VS Installer log candidates found.' | Set-Content -Path (Join-Path $EvidenceDir 'vs-installer-log-paths.txt') -Encoding UTF8
              Write-Host '  none found'
              return
            }
            $candidateLogs | ForEach-Object { $_.FullName } | Set-Content -Path (Join-Path $EvidenceDir 'vs-installer-log-paths.txt') -Encoding UTF8
            foreach ($log in $candidateLogs) {
              Write-Host "  $($log.FullName)"
              Copy-Item -Path $log.FullName -Destination (Join-Path $logDir $log.Name) -Force -ErrorAction SilentlyContinue
            }
          }

          Write-AvailableMsvcToolsets -VsInstallPath $installPath -EvidenceDir $evidenceDir
          $toolset = Get-Msvc1438Toolset -VsInstallPath $installPath
          if ($toolset.Count -eq 1) {
            Write-Host "MSVC 14.38 toolset already exists; skipping Visual Studio Installer modify: $($toolset[0].FullName)"
            exit 0
          }

          $installerExitCodes = @()
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "Installing CUDA 12.8-supported MSVC v143 toolset component $component into $installPath (attempt $attempt of 2)"
            $process = Start-Process -FilePath $vsInstaller -ArgumentList $installerArguments -Wait -PassThru -WindowStyle Hidden
            $installerExitCodes += $process.ExitCode
            "attempt=$attempt exit_code=$($process.ExitCode)" | Add-Content -Path (Join-Path $evidenceDir 'vs-installer-attempts.txt') -Encoding UTF8
            Write-Host "Visual Studio Installer attempt $attempt exited with code $($process.ExitCode)."
            Copy-VsInstallerLogs -EvidenceDir $evidenceDir
            Write-Host 'Re-checking actual MSVC 14.38 toolset after installer attempt.'
            Write-AvailableMsvcToolsets -VsInstallPath $installPath -EvidenceDir $evidenceDir
            $toolset = Get-Msvc1438Toolset -VsInstallPath $installPath
            if ($toolset.Count -eq 1) {
              Write-Host "Installed MSVC toolset $($toolset[0].Name) after installer attempt $attempt."
              break
            }
            if ($attempt -lt 2) {
              Write-Host 'Retrying Visual Studio Installer once because MSVC 14.38 is still absent.'
            }
          }

          if ($toolset.Count -ne 1) {
            Copy-VsInstallerLogs -EvidenceDir $evidenceDir
            $codes = ($installerExitCodes -join ',')
            throw "CUDA-supported MSVC 14.38 toolset remains absent after Visual Studio Installer attempts. Installer exit codes: $codes. Evidence directory: $evidenceDir"
          }
          Write-Host "Verified CUDA-supported MSVC 14.38 toolset: $($toolset[0].FullName)"

      - name: Upload Blackwell toolchain failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackwell-toolchain-failure-${{ github.run_id }}
          path: build/blackwell-toolchain-evidence
          if-no-files-found: warn

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          vsversion: '2022'
          toolset: 14.38

      - name: Verify CUDA-supported MSVC host compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CUDA_PATH) {
            $env:CUDA_PATH = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA\v${{ github.event.inputs.cuda_version }}"
          }
          $env:Path = "$($env:CUDA_PATH)\bin;$env:Path"
          if ($env:VisualStudioVersion -ne '17.0') {
            throw "Expected Visual Studio 2022 developer environment (VisualStudioVersion=17.0), got '$env:VisualStudioVersion'."
          }
          if ($env:VCToolsVersion -notmatch '^14\.38\.') {
            throw "Expected CUDA 12.8-supported MSVC 14.38 toolset, got VCToolsVersion='$env:VCToolsVersion'."
          }
          $clBanner = (& cl 2>&1 | Out-String)
          Write-Host $clBanner
          $match = [regex]::Match($clBanner, 'Compiler Version (?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)')
          if (-not $match.Success) {
            throw 'Could not parse cl.exe compiler version.'
          }
          $clVersion = [version]"$($match.Groups['major'].Value).$($match.Groups['minor'].Value).$($match.Groups['patch'].Value)"
          if ($clVersion.Major -ne 19 -or $clVersion.Minor -ne 38) {
            throw "CUDA 12.8 requires an MSVC 193x host compiler for VS 2022; cl.exe reported $clVersion."
          }
          nvcc --version
          $probeSource = Join-Path $env:RUNNER_TEMP 'cuda-host-compiler-probe.cu'
          $probeObject = Join-Path $env:RUNNER_TEMP 'cuda-host-compiler-probe.obj'
          @'
          __global__ void probe_kernel() {}
          int main() { return 0; }
          '@ | Set-Content -Path $probeSource -Encoding ASCII
          nvcc -v -c $probeSource -o $probeObject
          if (-not (Test-Path $probeObject)) {
            throw 'nvcc host compiler probe did not produce an object file.'
          }

      - name: Build NATTEN Blackwell candidate wheel
        shell: pwsh
        env:
          NATTEN_VERSION: ${{ github.event.inputs.natten_version }}
          CUDA_ARCH_LIST: ${{ github.event.inputs.cuda_arch_list }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = Get-Location
          $buildRoot = Join-Path $repoRoot 'build\blackwell-natten'
          $sourceDir = Join-Path $buildRoot 'NATTEN'
          $wheelDir = Join-Path $buildRoot 'dist'
          New-Item -ItemType Directory -Force -Path $buildRoot, $wheelDir | Out-Null

          if (-not $env:CUDA_PATH) {
            $env:CUDA_PATH = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA\v${{ github.event.inputs.cuda_version }}"
          }
          $env:Path = "$($env:CUDA_PATH)\bin;$env:Path"
          cl
          nvcc --version
          nvcc --list-gpu-arch
          nvcc --list-gpu-code

          python -m pip install --upgrade pip setuptools wheel ninja packaging
          python -m pip install --index-url $env:PYTORCH_CUDA_INDEX torch==$env:TORCH_VERSION torchvision==$env:TORCHVISION_VERSION

          git config --global core.longpaths true
          git clone --branch $env:NATTEN_VERSION --depth 1 --recurse-submodules https://github.com/SHI-Labs/NATTEN.git $sourceDir

          Write-Host 'Patch NATTEN MSVC-incompatible GCC warning flags recursively.'
          $flagPatterns = @(
            '-Xcompiler=-Wconversion',
            '-Xcompiler=-fno-strict-aliasing',
            '-Xcompiler=-Wall',
            '-Xcompiler -Wconversion',
            '-Xcompiler -fno-strict-aliasing',
            '-Xcompiler -Wall'
          )
          $patchableFiles = Get-ChildItem -Path $sourceDir -Recurse -File -Include '*.py','*.cmake','CMakeLists.txt','*.txt' |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          $patchedFlagFiles = @()
          foreach ($file in $patchableFiles) {
            $text = Get-Content -Raw -Path $file.FullName
            if ($null -eq $text) {
              Write-Host "Skipping empty patchable file $($file.FullName)"
              $text = ''
            }
            $newText = $text.ToString()
            foreach ($pattern in $flagPatterns) {
              $newText = $newText.Replace($pattern, '')
            }
            if ($newText -ne $text) {
              Set-Content -Path $file.FullName -Value $newText -Encoding UTF8
              $patchedFlagFiles += $file.FullName
            }
          }
          if ($patchedFlagFiles.Count -eq 0) {
            throw 'Expected to patch at least one NATTEN file containing MSVC-incompatible GCC compiler flags.'
          }
          $patchedFlagFiles | ForEach-Object { Write-Host "Patched GCC-only flags in $_" }

          Write-Host 'Patch vendored CUTLASS C++17 detection for MSVC.'
          $cutlassPlatform = Join-Path $sourceDir 'third_party\cutlass\include\cutlass\platform\platform.h'
          $cutlassText = Get-Content -Raw -Path $cutlassPlatform
          $cutlassText = $cutlassText.Replace('#if (__cplusplus >= 201703L)', '#if (__cplusplus >= 201703L) || (defined(_MSVC_LANG) && _MSVC_LANG >= 201703L)')
          $cutlassText = $cutlassText.Replace('#if (201703L <=__cplusplus)', '#if (201703L <= __cplusplus) || (defined(_MSVC_LANG) && _MSVC_LANG >= 201703L)')
          Set-Content -Path $cutlassPlatform -Value $cutlassText -Encoding UTF8

          Write-Host 'Patch NATTEN MSVC CUDA alternative-token checks.'
          $helpersPath = Join-Path $sourceDir 'csrc\include\natten\helpers.h'
          $helpersText = Get-Content -Raw -Path $helpersPath
          $helpersText = $helpersText.Replace('not x.is_sparse()', '!x.is_sparse()')
          Set-Content -Path $helpersPath -Value $helpersText -Encoding UTF8

          $env:TORCH_CUDA_ARCH_LIST = $env:CUDA_ARCH_LIST
          $env:NATTEN_CUDA_ARCH = $env:CUDA_ARCH_LIST
          $env:NATTEN_WITH_CUDA = '1'
          $env:FORCE_CUDA = '1'
          $env:USE_NINJA = '1'

          Push-Location $sourceDir
          try {
            python -m pip wheel . --no-build-isolation --no-deps --wheel-dir $wheelDir
          } finally {
            Pop-Location
          }

          $wheelPath = @(Get-ChildItem -Path $wheelDir -Filter "natten-$env:NATTEN_PACKAGE_VERSION-*-win_amd64.whl" -File)
          if ($wheelPath.Count -ne 1) {
            throw "Expected exactly one NATTEN $env:NATTEN_PACKAGE_VERSION Blackwell wheel, found $($wheelPath.Count)."
          }
          $wheelPath[0].FullName | Set-Content -Path (Join-Path $buildRoot 'natten-wheel-path.txt') -Encoding UTF8

      - name: Build Blackwell wheelhouse candidate archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nattenWheel = Get-Content -Raw -Path build\blackwell-natten\natten-wheel-path.txt
          $nattenWheel = $nattenWheel.Trim()
          Write-Host "Building windows-x64-cp311-cuda128-blackwell candidate with NATTEN wheel: $nattenWheel"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/wheelhouse/build-windows-x64-cp311-cuda128-blackwell.ps1 -NattenWheelPath $nattenWheel -NattenVersion $env:NATTEN_PACKAGE_VERSION

      - name: Upload Blackwell candidate artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixal3d-wheelhouse-${{ env.WHEELHOUSE_LANE }}-candidate
          path: build/wheelhouse/${{ env.WHEELHOUSE_LANE }}/dist/wheelhouse/*
          if-no-files-found: error
