name: Windows cp311 real dependency installation

on:
  pull_request:
    paths:
      - 'setup.py'
      - 'requirements.txt'
      - 'modly_wheelhouse.py'
      - 'wheelhouse.manifest.json'
      - 'pixal3d_extension/**'
      - 'tools/wheelhouse/**'
      - 'wheels/**'
      - 'test/**'
      - 'tools/validation/windows_dependency_install.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-install:
    name: Clean Windows cp311 install (GPU not qualified)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run unmodified setup and collect real dependency evidence
        shell: pwsh
        run: |
          python tools/validation/windows_dependency_install.py --evidence "$env:RUNNER_TEMP/pixal3d-windows-dependency-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected dependency-install validation failure' }

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cp311-dependency-evidence
          path: ${{ runner.temp }}/pixal3d-windows-dependency-evidence/
          if-no-files-found: error
