name: Windows MV path custody

on:
  pull_request:
    paths:
      - 'pixal3d_extension/multiview_images.py'
      - 'test/test_windows_multiview_custody.py'
      - '.github/workflows/windows-mv-path-custody.yml'
  push:
    paths:
      - 'pixal3d_extension/multiview_images.py'
      - 'test/test_windows_multiview_custody.py'
      - '.github/workflows/windows-mv-path-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-custody:
    name: Win32 stable-handle custody
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0

      - name: Exercise real Windows file and reparse-point custody
        shell: pwsh
        run: python -m unittest discover -s test -p 'test_windows_multiview_custody.py' -v
